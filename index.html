<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calorizen v4 — AI Wellness Edition</title>

<!-- Tailwind, Lucide, Chart.js -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
 body{font-family:'Inter',sans-serif;background:#f9fafb;transition:.3s;}
 .dark body{background:#111827;color:#f9fafb;}
 .tab.active{border-color:#6366f1;color:#6366f1;background:#eef2ff}
 .hidden{display:none}
 .file-label{cursor:pointer;display:inline-flex;align-items:center;gap:.5rem;
  background:#6366f1;color:#fff;padding:.5rem 1rem;border-radius:.5rem;font-weight:600}
 .file-label:hover{background:#4f46e5}
 .dark .file-label{background:#818cf8;color:#111827;}
</style>
</head>
<body class="text-gray-800 dark:text-gray-100 transition-colors">

<div class="max-w-lg mx-auto bg-white dark:bg-gray-900 shadow-lg rounded-lg p-4 my-4">
<header class="text-center mb-4 flex justify-between items-center">
  <div>
    <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600">Calorizen v4</h1>
    <p class="text-gray-500 dark:text-gray-400 text-sm">AI Wellness & Calorie Companion</p>
  </div>
  <button id="themeToggle" class="bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-100 p-2 rounded-full"><i data-lucide="moon"></i></button>
</header>

<nav class="flex justify-around border-b mb-4 overflow-x-auto text-sm font-medium">
 <button class="tab active flex-1 py-2" data-tab="daily"><i data-lucide="scale" class="w-4 h-4 inline"></i> Daily</button>
 <button class="tab flex-1 py-2" data-tab="manual"><i data-lucide="pencil" class="w-4 h-4 inline"></i> Food</button>
 <button class="tab flex-1 py-2" data-tab="scan"><i data-lucide="camera" class="w-4 h-4 inline"></i> Scan</button>
 <button class="tab flex-1 py-2" data-tab="diet"><i data-lucide="clipboard-list" class="w-4 h-4 inline"></i> Diet</button>
 <button class="tab flex-1 py-2" data-tab="forecast"><i data-lucide="chart-line" class="w-4 h-4 inline"></i> Forecast</button>
 <button class="tab flex-1 py-2" data-tab="mood"><i data-lucide="smile" class="w-4 h-4 inline"></i> MoodCal</button>
</nav>

<main id="app"></main>
</div>

<script>
document.addEventListener("DOMContentLoaded",()=>{
 lucide.createIcons();
 const app=document.getElementById("app");
 const tabs=document.querySelectorAll(".tab");

 // theme toggle
 const btn=document.getElementById("themeToggle");
 btn.onclick=()=>{document.documentElement.classList.toggle("dark");btn.innerHTML=document.documentElement.classList.contains("dark")?"<i data-lucide='sun'></i>":"<i data-lucide='moon'></i>";lucide.createIcons();}

 tabs.forEach(t=>t.onclick=()=>{tabs.forEach(x=>x.classList.remove("active"));t.classList.add("active");showTab(t.dataset.tab);});
 showTab("daily");

 function showTab(tab){
  if(tab==="daily") return renderDaily();
  if(tab==="manual") return renderManual();
  if(tab==="scan") return renderScan();
  if(tab==="diet") return renderDiet();
  if(tab==="forecast") return renderForecast();
  if(tab==="mood") return renderMood();
 }

 /* ----- DAILY NEEDS ----- */
 function renderDaily(){
  app.innerHTML=`
   <h2 class='text-2xl font-bold text-center mb-2'>Daily Calorie Needs</h2>
   <form id='needForm' class='space-y-2'>
     <input id='age' type='number' placeholder='Age' class='w-full border rounded p-2'>
     <select id='gender' class='w-full border rounded p-2'><option value='male'>Male</option><option value='female'>Female</option></select>
     <input id='h' type='number' placeholder='Height (cm)' class='w-full border rounded p-2'>
     <input id='w' type='number' placeholder='Weight (kg)' class='w-full border rounded p-2'>
     <select id='act' class='w-full border rounded p-2'>
       <option value='sedentary'>Sedentary</option>
       <option value='light'>Light (1-3 days)</option>
       <option value='moderate'>Moderate (3-5 days)</option>
       <option value='active'>Active (6-7 days)</option>
       <option value='very_active'>Very Active</option>
     </select>
     <button class='w-full bg-indigo-600 text-white py-2 rounded'>Calculate</button>
   </form>
   <div id='res' class='hidden mt-4 text-center bg-indigo-50 dark:bg-indigo-900 p-3 rounded'>
     <p class='font-semibold text-indigo-700 dark:text-indigo-200'>Maintenance Calories</p>
     <p class='text-3xl font-bold text-indigo-600 dark:text-indigo-100'><span id='out'></span> kcal/day</p>
   </div>`;
   document.getElementById("needForm").onsubmit=e=>{
     e.preventDefault();
     const age=+val("age"),h=+val("h"),w=+val("w"),g=val("gender"),a=val("act");
     if(!age||!h||!w)return alert("Please fill all fields");
     const bmr=g==="male"?10*w+6.25*h-5*age+5:10*w+6.25*h-5*age-161;
     const m={sedentary:1.2,light:1.375,moderate:1.55,active:1.725,very_active:1.9};
     const tdee=Math.round(bmr*m[a]);
     document.getElementById("out").textContent=tdee;
     document.getElementById("res").classList.remove("hidden");
   }
   function val(id){return document.getElementById(id).value}
 }

 /* ----- FOOD LOG ----- */
 let foods=[];
 function renderManual(){
  app.innerHTML=`
   <h2 class='text-2xl font-bold text-center mb-2'>Food Log</h2>
   <form id='fForm' class='space-y-2'>
     <input id='fname' type='text' placeholder='Food name' class='w-full border rounded p-2'>
     <input id='fcal' type='number' placeholder='Calories' class='w-full border rounded p-2'>
     <button class='w-full bg-green-600 text-white py-2 rounded'>Add</button>
   </form>
   <ul id='flist' class='mt-3 space-y-1'></ul>
   <p id='ftotal' class='text-right font-semibold mt-2'></p>`;
  document.getElementById("fForm").onsubmit=e=>{
    e.preventDefault();
    const n=getv("fname"),c=+getv("fcal");if(!n||!c)return;
    foods.push({n,c});update();
    e.target.reset();
  };
  function update(){
    const list=document.getElementById("flist");
    list.innerHTML=foods.map((f,i)=>`<li class='flex justify-between border p-2 rounded'>
      <span>${f.n}</span><span>${f.c} kcal <button data-i='${i}' class='text-red-500'>x</button></span></li>`).join("");
    document.getElementById("ftotal").textContent="Total = "+foods.reduce((a,b)=>a+b.c,0)+" kcal";
    list.querySelectorAll("button").forEach(b=>b.onclick=()=>{foods.splice(b.dataset.i,1);update();});
  }
  function getv(id){return document.getElementById(id).value.trim()}
 }

 /* ----- SCAN (MOCK AI) ----- */
 function renderScan(){
  app.innerHTML=`
   <h2 class='text-2xl font-bold text-center mb-2'>Scan Food (Mock AI)</h2>
   <label for='photo' class='file-label'><i data-lucide='camera'></i>Upload Photo</label>
   <input id='photo' type='file' accept='image/*' class='hidden'>
   <img id='prev' class='hidden mt-3 rounded-lg border mx-auto max-w-xs'>
   <form id='scanForm' class='mt-3 space-y-2'>
    <input id='amt' type='text' placeholder='Amount (e.g. 100g)' class='w-full border rounded p-2'>
    <button class='w-full bg-blue-600 text-white py-2 rounded'>Analyze</button>
   </form>
   <div id='sres' class='hidden mt-3 p-3 text-center bg-blue-50 dark:bg-blue-900 rounded'></div>`;
  lucide.createIcons();
  const f=document.getElementById("photo"),p=document.getElementById("prev"),r=document.getElementById("sres");
  f.onchange=()=>{if(f.files[0]){const reader=new FileReader();reader.onload=e=>{p.src=e.target.result;p.classList.remove("hidden");};reader.readAsDataURL(f.files[0]);}};
  document.getElementById("scanForm").onsubmit=e=>{
    e.preventDefault();
    if(!f.files[0])return alert("Upload a photo");
    const cal=Math.floor(120+Math.random()*380);
    r.innerHTML=`<p class='font-semibold text-blue-700 dark:text-blue-200'>Detected Food (Sample)</p>
    <p class='text-2xl font-bold text-blue-600 dark:text-blue-100'>≈ ${cal} kcal</p>`;
    r.classList.remove("hidden");
  };
 }

 /* ----- DIET PLANNER ----- */
 function renderDiet(){
  app.innerHTML=`
   <h2 class='text-2xl font-bold text-center mb-2'>AI Diet Planner (Offline)</h2>
   <form id='dForm' class='space-y-2'>
     <select id='goal' class='w-full border rounded p-2'>
       <option value='lose'>Lose Weight</option>
       <option value='gain'>Gain Weight</option>
       <option value='muscle'>Build Muscle</option>
     </select>
     <button class='w-full bg-purple-600 text-white py-2 rounded'>Generate</button>
   </form>
   <div id='dout' class='hidden mt-3 p-3 bg-purple-50 dark:bg-purple-900 rounded'></div>`;
  document.getElementById("dForm").onsubmit=e=>{
    e.preventDefault();
    const g=document.getElementById("goal").value;
    const p={lose:["Oats + berries","Grilled chicken + salad","Brown rice + veggies"],
             gain:["Peanut butter toast","Pasta + chicken","Smoothie + banana & milk"],
             muscle:["Eggs + avocado","Rice + salmon","Protein shake + nuts"]};
    document.getElementById("dout").innerHTML=p[g].map(i=>"• "+i).join("<br>");
    document.getElementById("dout").classList.remove("hidden");
  };
 }

 /* ----- FORECAST ----- */
 function renderForecast(){
  app.innerHTML=`
   <h2 class='text-2xl font-bold text-center mb-2'>SmartCal Forecast</h2>
   <canvas id='chart' height='200'></canvas>`;
  const ctx=document.getElementById("chart");
  const vals=[2000,2200,2100,2500,2300,2400,2600];
  new Chart(ctx,{type:'line',data:{labels:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],
   datasets:[{data:vals,borderColor:"#6366f1",fill:false,tension:.3}]},
   options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});
 }

 /* ----- MOODCAL (NEW FEATURE) ----- */
 function renderMood(){
  app.innerHTML=`
   <h2 class='text-2xl font-bold text-center mb-2'>Mood-Based Calorie Predictor</h2>
   <p class='text-center text-sm text-gray-500 mb-2'>Choose your current mood 👇</p>
   <div id='moods' class='flex justify-around text-3xl mb-4'>
     <button data-mood='Happy'>😃</button>
     <button data-mood='Neutral'>😐</button>
     <button data-mood='Sad'>😔</button>
     <button data-mood='Angry'>😡</button>
     <button data-mood='Tired'>😴</button>
   </div>
   <div id='mres' class='hidden bg-yellow-50 dark:bg-yellow-900 p-4 rounded text-center'></div>`;
  document.querySelectorAll("#moods button").forEach(btn=>{
    btn.onclick=()=>{
      const mood=btn.dataset.mood;
      const bias=Math.floor((Math.random()*2-1)*300);
      const foods={
        Happy:["Balanced Meal","Fresh Salad","Smoothie"],
        Neutral:["Grilled Fish","Brown Rice","Soup"],
        Sad:["Dark Chocolate","Oatmeal","Comfort Soup"],
        Angry:["Herbal Tea","Fruits","Yogurt"],
        Tired:["Protein Shake","Eggs","Banana"]
      };
      const r=document.getElementById("mres");
      r.innerHTML=`<p class='font-semibold text-yellow-800 dark:text-yellow-100 mb-1'>Detected Mood: ${mood}</p>
      <p class='text-lg font-bold ${bias>=0?"text-green-600":"text-red-600"}'>
      ${bias>=0?"+":"−"}${Math.abs(bias)} kcal tendency</p>
      <p class='mt-2 text-sm'>Suggested foods:<br>${foods[mood].join(", ")}</p>`;
      r.classList.remove("hidden");
    }
  });
 }
});
</script>
</body>
</html>
